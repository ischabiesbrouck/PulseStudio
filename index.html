<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PulseStudio</title>
  <meta name="description" content="PulseStudio: een all-in-one DAW in je browser. Opnemen, componeren, mixen en exporteren.">
  <meta name="theme-color" content="#1f1f23">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <!-- Alle code tegelijk ophalen in plaats van module na module (scheelt veel wachten). Houd deze lijst gelijk aan SHELL in sw.js. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/model.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/wav.js">
  <link rel="modulepreload" href="js/demo-song.js">
  <link rel="modulepreload" href="js/audio/engine.js">
  <link rel="modulepreload" href="js/audio/chain.js">
  <link rel="modulepreload" href="js/audio/instruments.js">
  <link rel="modulepreload" href="js/audio/recorder.js">
  <link rel="modulepreload" href="js/audio/plugins.js">
  <link rel="modulepreload" href="js/audio/plugin-defs.js">
  <link rel="modulepreload" href="js/audio/library.js">
  <link rel="modulepreload" href="js/audio/dsp.js">
  <link rel="modulepreload" href="js/audio/samplelib.js">
  <link rel="modulepreload" href="js/audio/patterns.js">
  <link rel="modulepreload" href="js/audio/stretch.js">
  <link rel="modulepreload" href="js/audio/warp.js">
  <link rel="modulepreload" href="js/audio/loudness.js">
  <link rel="modulepreload" href="js/audio/wam.js">
  <link rel="modulepreload" href="js/audio/pitch.js">
  <link rel="modulepreload" href="js/vendor/wam/initializeWamHost.js">
  <link rel="modulepreload" href="js/vendor/wam/apiVersion.js">
  <link rel="modulepreload" href="js/vendor/wam/addFunctionModule.js">
  <link rel="modulepreload" href="js/vendor/wam/WamEnv.js">
  <link rel="modulepreload" href="js/vendor/wam/WamGroup.js">
  <link rel="modulepreload" href="js/ui/dom.js">
  <link rel="modulepreload" href="js/ui/theme.js">
  <link rel="modulepreload" href="js/ui/knob.js">
  <link rel="modulepreload" href="js/ui/devices.js">
  <link rel="modulepreload" href="js/ui/arrange.js">
  <link rel="modulepreload" href="js/ui/editor.js">
  <link rel="modulepreload" href="js/ui/mixer.js">
  <link rel="modulepreload" href="js/ui/inspector.js">
  <link rel="modulepreload" href="js/ui/browser.js">
</head>
<body>
  <div id="app"></div>
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-box">
      <div class="boot-title"><span class="logo" aria-hidden="true"></span>PulseStudio</div>
      <div class="boot-bar"><i></i></div>
      <p class="boot-msg">Wordt geladen…</p>
      <div class="boot-actions"></div>
    </div>
  </div>
  <noscript><p style="padding:40px;color:#ccc">PulseStudio heeft JavaScript nodig.</p></noscript>
  <script>
    // Laadscherm: voortgang, en een duidelijke melding met herstelknoppen als het laden misgaat of blijft hangen.
    (function () {
      var boot = document.getElementById('boot');
      var bar = boot.querySelector('.boot-bar i');
      var msg = boot.querySelector('.boot-msg');
      var actions = boot.querySelector('.boot-actions');
      var expected = document.querySelectorAll('link[rel=modulepreload]').length;
      var failed = false;
      try {
        new PerformanceObserver(function (list) {
          var n = performance.getEntriesByType('resource').filter(function (r) { return /\.js(\?|$)/.test(r.name); }).length;
          bar.style.width = Math.min(95, Math.round((n / expected) * 95)) + '%';
        }).observe({ type: 'resource', buffered: true });
      } catch (e) { bar.style.width = '50%'; }
      function button(text, primary, onclick) {
        var b = document.createElement('button');
        b.className = 'btn' + (primary ? ' primary' : '');
        b.textContent = text;
        b.onclick = onclick;
        actions.appendChild(b);
      }
      // Wist alleen de opgeslagen programmacode; projecten en opnames blijven bewaard.
      function fresh() {
        msg.textContent = 'Opnieuw laden met een verse versie…';
        var jobs = [];
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /^pulsestudio-v/.test(k); }).map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      window.__psFail = function (text) {
        if (failed || window.__psReady) return;
        failed = true;
        bar.style.background = '#e0533d';
        msg.textContent = text + ' Controleer je internetverbinding en probeer het opnieuw. Je projecten blijven bewaard.';
        button('Opnieuw proberen', true, function () { location.reload(); });
        button('Verse versie laden', false, fresh);
      };
      window.__psDone = function () {
        window.__psReady = true;
        bar.style.width = '100%';
        boot.hidden = true;
      };
      window.addEventListener('error', function (e) {
        if (!window.__psReady && e.message) window.__psFail('Er ging iets mis bij het starten (' + e.message + ').');
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (!window.__psReady) window.__psFail('Er ging iets mis bij het starten (' + ((e.reason && e.reason.message) || e.reason) + ').');
      });
      setTimeout(function () {
        if (!window.__psReady && !failed) {
          msg.textContent = 'Het laden duurt langer dan normaal. Even geduld, of probeer het opnieuw.';
          button('Opnieuw proberen', true, function () { location.reload(); });
          button('Verse versie laden', false, fresh);
        }
      }, 12000);
    })();
  </script>
  <script type="module" src="js/app.js" onerror="__psFail('Een onderdeel van PulseStudio kon niet worden gedownload.')"></script>
</body>
</html>
